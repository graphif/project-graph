  publish-release:
    needs: package-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: ${{ runner.temp }}/project-graph-release
      - name: Publish complete release
        env:
          ASSET_DIR: ${{ runner.temp }}/project-graph-release
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RELEASE_NAME: ${{ inputs.release_name }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: bash .github/scripts/publish-complete-release.sh

  bump-aur-version:
    needs: publish-release
    runs-on: ubuntu-latest
    if: inputs.aur_package_name != ''
    env:
      APP_VERSION: ${{ inputs.app_version }}
      AUR_PACKAGE: ${{ inputs.aur_package_name }}
      AUR_VERSION: ${{ inputs.aur_version }}
      AUR_ALGORITHM: ${{ inputs.aur_key_algorithm }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup AUR private key
        env:
          AUR_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$AUR_PRIVATE_KEY" > "$HOME/.ssh/id_$AUR_ALGORITHM"
          chmod 600 "$HOME/.ssh/id_$AUR_ALGORITHM"
          ssh-keyscan -t "$AUR_ALGORITHM" aur.archlinux.org >> "$HOME/.ssh/known_hosts"
      - name: Clone AUR repository
        run: git clone -- "ssh://aur@aur.archlinux.org/$AUR_PACKAGE.git" ./aurpackage
      - name: Update version in PKGBUILD and .SRCINFO
        env:
          repo: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd aurpackage
          node ../.github/scripts/generate-pkgbuild.mjs "$AUR_PACKAGE" "$AUR_VERSION"
      - name: Commit and push changes
        run: |
          cd aurpackage
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "Bump version to $APP_VERSION"
          git push origin master
