name: Publish

on:
  workflow_call:
    inputs:
      app_version:
        type: string
        description: The version of the app.
        required: false
        default: "0.0.0"
      app_version_android:
        type: string
        description: The version of the app for Android, CANNOT be `0.0.0`
        required: true
      release_name:
        type: string
        description: The name of the release.
        required: false
        default: Release
      release_tag:
        type: string
        description: The tag to use for the release.
        required: true
      prerelease:
        type: boolean
        description: Whether to make the release a prerelease.
        required: false
        default: false
      android_key_path:
        type: string
        description: File name of the Android keystore under the Android app directory
        required: false
        default: "upload.jks"
      aur_package_name:
        type: string
        description: The name of the AUR package.
        required: false
        default: ""
      aur_key_algorithm:
        type: string
        description: The algorithm to use for the AUR key.
        required: false
        default: "ed25519"
      aur_version:
        type: string
        description: The version of the AUR package.
        required: true
      task_build:
        type: string
        description: The task to run for building the app.
        required: false
        default: "tauri:build"
      task_build_android:
        type: string
        description: The task to run for building the app for Android.
        required: false
        default: "tauri:build:android"
      android_key_alias:
        type: string
        description: The alias of the Android key.
        required: false
        default: "upload"
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        description: Sign app binaries for updater support.
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        description: Password for the signing key.
        required: false
      ANDROID_KEYSTORE:
        description: Base64 of `jks` file for APK signing.
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        description: Password for the keystore.
        required: false
      BUILD_ENV:
        description: "Environment variables to pass to `tauri build`. Format: `key1=value1\\nkey2=value2\\n...`."
        required: false
      AUR_SSH_PRIVATE_KEY:
        description: "SSH private key for AUR publishing."
        required: false
      GEMINI_API_KEY:
        description: Authenticate Google Gemini to generate changelog.
        required: false

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate publish inputs
        env:
          APP_VERSION: ${{ inputs.app_version }}
          ANDROID_VERSION: ${{ inputs.app_version_android }}
          ANDROID_KEY_PATH: ${{ inputs.android_key_path }}
          ANDROID_KEY_ALIAS: ${{ inputs.android_key_alias }}
          AUR_PACKAGE: ${{ inputs.aur_package_name }}
          AUR_ALGORITHM: ${{ inputs.aur_key_algorithm }}
          AUR_VERSION: ${{ inputs.aur_version }}
          BUILD_TASK: ${{ inputs.task_build }}
          ANDROID_BUILD_TASK: ${{ inputs.task_build_android }}
        run: |
          version_pattern='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          [[ "$APP_VERSION" =~ $version_pattern && "$ANDROID_VERSION" =~ $version_pattern ]] ||
            { echo "::error::Invalid app version"; exit 1; }
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]] ||
            ! git check-ref-format "refs/tags/$RELEASE_TAG"; then
            echo "::error::Invalid release tag"
            exit 1
          fi
          [[ "$ANDROID_KEY_PATH" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*\.jks$ && "$ANDROID_KEY_ALIAS" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] ||
            { echo "::error::Invalid Android keystore file name or alias"; exit 1; }
          [[ "$BUILD_TASK" =~ ^[A-Za-z0-9][A-Za-z0-9:_-]*$ && "$ANDROID_BUILD_TASK" =~ ^[A-Za-z0-9][A-Za-z0-9:_-]*$ ]] ||
            { echo "::error::Invalid pnpm task name"; exit 1; }
          if [[ -n "$AUR_PACKAGE" ]]; then
            if [[ ! "$AUR_PACKAGE" =~ ^[a-z0-9][a-z0-9@._+-]*$ || ! "$AUR_VERSION" =~ ^[a-zA-Z0-9][a-zA-Z0-9._+-]*$ ]] ||
              [[ "$AUR_ALGORITHM" != ed25519 && "$AUR_ALGORITHM" != rsa && "$AUR_ALGORITHM" != ecdsa ]]; then
              echo "::error::Invalid AUR package, version or SSH key algorithm"
              exit 1
            fi
          fi

  package-tauri:
    needs: [validate-inputs]
    permissions:
      contents: read
    env:
      APP_VERSION: ${{ inputs.app_version }}
      ANDROID_VERSION: ${{ inputs.app_version_android }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04"
            android: false
            variant: ""
            args: '["--bundles","deb"]'
            bundle_dir: "app/src-tauri/target/release/bundle"
          - platform: "windows-latest"
            android: false
            variant: ""
            args: "[]"
            bundle_dir: "app/src-tauri/target/release/bundle/nsis"
          - platform: "macos-latest"
            android: false
            variant: ""
            args: '["--target","universal-apple-darwin"]'
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            bundle_dir: "app/src-tauri/target/universal-apple-darwin/release/bundle"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      #region Prepare environment
      - name: Free disk space
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache
          df -h
      - name: Linux - Install dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libfuse2 \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxcb1-dev \
            libudev-dev \
            libwebkit2gtk-4.1-dev
      - uses: pnpm/action-setup@v4
        id: pnpm
        name: Install pnpm
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - name: macOS - Tune build for CI memory limits
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          echo "=== System info ==="
          df -h
          sysctl hw.memsize hw.ncpu hw.physicalcpu hw.logicalcpu 2>/dev/null || true
          top -l 1 | head -10 || true

          {
            # Limit peak memory on the runner.
            echo "CARGO_PROFILE_RELEASE_LTO=thin"
            echo "CARGO_PROFILE_RELEASE_CODEGEN_UNITS=8"
            echo "CARGO_BUILD_JOBS=2"
            echo "CARGO_REGISTRIES_CRATES_IO_PROTOCOL=sparse"
            echo "RUST_BACKTRACE=short"
          } >> "$GITHUB_ENV"
          # NOTE: Do NOT set --error-format in RUSTFLAGS; Cargo already injects
          #   `--error-format=json` and rustc refuses to accept the option twice.

          echo "=== Env tuned ==="
      - name: macOS - Verify env vars actually propagate to cargo
        if: matrix.platform == 'macos-latest'
        shell: bash
        working-directory: app/src-tauri
        run: |
          set -e
          echo "CARGO_PROFILE_RELEASE_LTO = ${CARGO_PROFILE_RELEASE_LTO:-<unset>}"
          echo "CARGO_PROFILE_RELEASE_CODEGEN_UNITS = ${CARGO_PROFILE_RELEASE_CODEGEN_UNITS:-<unset>}"
          echo "CARGO_BUILD_JOBS = ${CARGO_BUILD_JOBS:-<unset>}"
          # Use `cargo config get` (available since Rust 1.77) to confirm what cargo *actually* sees.
          # Fail open: if cargo config get isn't available, just warn.
          cargo config get profile.release.lto 2>&1 || echo "  (cannot check via cargo config)"
          cargo config get build.jobs 2>&1 || echo "  (cannot check via cargo config)"
      #endregion
      #region Android - Prepare environment
      - name: Android - Setup Java
        if: matrix.android
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
      - name: Android - Setup Android SDK
        if: matrix.android
        uses: android-actions/setup-android@v3
      - name: Android - Setup Android NDK
        if: matrix.android
        run: sdkmanager "ndk;27.0.11902837"
      - name: Android - Setup Android APK Signing
        if: matrix.android
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ inputs.android_key_alias }}
          ANDROID_KEY_PATH: ${{ inputs.android_key_path }}
        run: |
          cd app/src-tauri/gen/android
          printf 'password=%s\nkeyAlias=%s\nstoreFile=%s\n' "$ANDROID_RELEASE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PATH" > keystore.properties
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > "app/$ANDROID_KEY_PATH"
      #endregion
      #region Edit version
      - name: Set app version
        shell: bash
        if: ${{ !matrix.android && !matrix.variant }}
        run: |
          node ./.github/scripts/set-version.mjs "$APP_VERSION"
      - name: Set app version when variant exists
        shell: bash
        env:
          BUILD_VARIANT: ${{ matrix.variant }}
        if: ${{ !matrix.android && matrix.variant }}
        run: |
          node ./.github/scripts/set-version.mjs "$APP_VERSION-$BUILD_VARIANT"
      - name: Android - Set app version
        shell: bash
        if: matrix.android
        run: |
          node ./.github/scripts/set-version.mjs "$ANDROID_VERSION"
      - name: Windows - Use static CRT
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          @(
            "RUSTFLAGS=-C target-feature=+crt-static"
            "NX_DAEMON=false"
            "NX_ISOLATE_PLUGINS=false"
            "NX_PLUGIN_NO_TIMEOUTS=true"
          ) >> $env:GITHUB_ENV
      #endregion
      #region Build
      - name: Write BUILD_ENV to .env file
        if: matrix.variant != 'foss'
        shell: bash
        env:
          BUILD_ENV: ${{ secrets.BUILD_ENV }}
        run: |
          printf '%s\n' "$BUILD_ENV" > app/.env
      - name: Build (Unix)
        if: matrix.platform != 'windows-latest'
        id: build_unix
        shell: bash
        run: |
          set -o pipefail
          LOG_FILE="$RUNNER_TEMP/build.log"
          echo "Build log will be tee'd to: $LOG_FILE"
          # script(1) forces line-buffered stdout/stderr even when nx buffers internally.
          # Fallback: plain tee if script is unavailable (linux docker images).
          BUILD_CMD="pnpm run \"\$BUILD_TASK\""
          if command -v script >/dev/null 2>&1; then
            if [[ "${{ matrix.platform }}" == "macos-latest" ]]; then
              script -q "$LOG_FILE" bash -lc "$BUILD_CMD"
            else
              # util-linux script must propagate the build's exit code to Actions.
              script -q -e -c "$BUILD_CMD" "$LOG_FILE"
            fi
          else
            bash -lc "$BUILD_CMD" 2>&1 | tee "$LOG_FILE"
          fi
        env:
          BUILD_TASK: ${{ matrix.android && inputs.task_build_android || inputs.task_build }}
          APPIMAGE_EXTRACT_AND_RUN: ${{ matrix.platform == 'ubuntu-22.04' && '1' || '' }}
          NO_STRIP: ${{ matrix.platform == 'ubuntu-22.04' && 'true' || '' }}
          TAURI_BUILD_ARGS: ${{ matrix.args }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.11902837
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NX_SKIP_LOG_GROUPING: "true"
          CI: "true"
          TAURI_BUNDLER_DMG_IGNORE_CI: ${{ matrix.platform == 'macos-latest' && 'true' || '' }}
      - name: Build (Windows)
        if: matrix.platform == 'windows-latest'
        id: build_windows
        shell: pwsh
        run: |
          $LogFile = Join-Path $env:RUNNER_TEMP "build.log"
          Write-Host "Build log will be tee'd to: $LogFile"
          pnpm run $env:BUILD_TASK 2>&1 | Tee-Object -FilePath $LogFile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          BUILD_TASK: ${{ matrix.android && inputs.task_build_android || inputs.task_build }}
          TAURI_BUILD_ARGS: ${{ matrix.args }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NX_DAEMON: "false"
          NX_ISOLATE_PLUGINS: "false"
          NX_PLUGIN_NO_TIMEOUTS: "true"
          NX_SKIP_LOG_GROUPING: "true"
          CI: "true"
      - name: Build failure diagnostics (Unix)
        if: failure() && (steps.build_unix.outcome == 'failure' || steps.build_windows.outcome == 'failure') && matrix.platform != 'windows-latest'
        shell: bash
        run: |
          LOG_FILE="$RUNNER_TEMP/build.log"
          echo "==================== BUILD FAILED: EXIT DIAGNOSTICS ===================="
          echo "--- Build log (last 500 lines) from $LOG_FILE ---"
          if [ -f "$LOG_FILE" ]; then
            tail -n 500 "$LOG_FILE" || true
          else
            echo "(no build.log found at $LOG_FILE)"
          fi
          echo "--- Disk usage ---"
          df -h 2>/dev/null || true
          echo "--- Top-level target dirs by size ---"
          du -sh app/src-tauri/target 2>/dev/null || true
          du -sh app/src-tauri/target/*/release 2>/dev/null | sort -hr || true
          echo "--- Memory / load snapshot ---"
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            top -l 1 | head -15 || true
            vm_stat 2>/dev/null | head -10 || true
          else
            free -h 2>/dev/null || true
            uptime 2>/dev/null || true
          fi
          echo "========================================================================"
      - name: Build failure diagnostics (Windows)
        if: failure() && steps.build_windows.outcome == 'failure' && matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $LogFile = Join-Path $env:RUNNER_TEMP "build.log"
          Write-Host "==================== BUILD FAILED: EXIT DIAGNOSTICS ===================="
          Write-Host "--- Build log (last 500 lines) from $LogFile ---"
          if (Test-Path $LogFile) {
            Get-Content $LogFile -Tail 500
          } else {
            Write-Host "(no build.log found at $LogFile)"
          }
          Write-Host "--- Disk usage ---"
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, Used, Free
          Write-Host "--- Target dir sizes ---"
          if (Test-Path app\src-tauri\target) {
            Get-ChildItem app\src-tauri\target -Directory -ErrorAction SilentlyContinue | ForEach-Object {
              $Size = (Get-ChildItem $_.FullName -Recurse -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum).Sum
              [PSCustomObject]@{Dir=$_.Name; SizeMB=[math]::Round($Size/1MB,1)}
            } | Sort-Object SizeMB -Descending | Select-Object -First 10 | Format-Table -AutoSize
          }
          Write-Host "========================================================================"

      - name: macOS - Verify DMG background and layout
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          MOUNT_POINT=$(mktemp -d "$RUNNER_TEMP/project-graph-dmg.XXXXXX")
          trap 'hdiutil detach "$MOUNT_POINT" >/dev/null 2>&1 || true; rmdir "$MOUNT_POINT"' EXIT
          DMG_PATH=$(find app/src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$DMG_PATH"
          hdiutil attach "$DMG_PATH" -readonly -nobrowse -mountpoint "$MOUNT_POINT"
          test -s "$MOUNT_POINT/.DS_Store"
          cmp app/src-tauri/dmg/background.png "$MOUNT_POINT/.background/background.png"
          test -d "$MOUNT_POINT/Project Graph.app"
          test -L "$MOUNT_POINT/Applications"
          echo "DMG background, Finder layout record, application and Applications link verified."
      - name: MacOS - Rename app.tar.gz
        if: matrix.platform == 'macos-latest'
        run: |
          cd app/src-tauri/target/universal-apple-darwin/release/bundle/macos
          mv ./*.app.tar.gz "Project Graph_${APP_VERSION}_universal.app.tar.gz"
          mv ./*.app.tar.gz.sig "Project Graph_${APP_VERSION}_universal.app.tar.gz.sig"
      - name: Linux - Bundle rpm
        if: matrix.platform == 'ubuntu-22.04'
        env:
          APP_VERSION: ${{ inputs.app_version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CI: "true"
        run: |
          node --test .github/scripts/rpm-config.test.mjs
          # shortcut: Tauri 2.12.4 passes SemVer directly to rpm-rs; remove when upstream maps prereleases.
          RPM_CONFIG=$(node .github/scripts/rpm-config.mjs "$APP_VERSION")
          pnpm --filter @graphif/project-graph exec tauri bundle --bundles rpm --config "$RPM_CONFIG"
      - name: Linux - Rename rpm
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          cd app/src-tauri/target/release/bundle/rpm
          mv ./*.rpm "Project Graph_${APP_VERSION}_amd64.rpm"
          mv ./*.rpm.sig "Project Graph_${APP_VERSION}_amd64.rpm.sig"
      - name: Stage release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            ${{ matrix.bundle_dir }}/**/*.deb
            ${{ matrix.bundle_dir }}/**/*.rpm
            ${{ matrix.bundle_dir }}/**/*.dmg
            ${{ matrix.bundle_dir }}/**/*.tar.gz
            ${{ matrix.bundle_dir }}/**/*.exe
            ${{ matrix.bundle_dir }}/**/*.sig
      #endregion

